<!DOCTYPE html>
<!--
  DEV-ONLY diagnostic tool -- NOT shipped to production (stripped from
  dist/ by scripts/strip-dev-only-files.mjs, same pattern as harness.html).

  Purpose: Ryan can still see a dark seam along the Chroma contact rim
  that this project's own screenshot-based verification (multiple rounds,
  including CSS `zoom` at 1/1.25/1.5 approximating Windows display
  scaling) has never been able to reproduce. Rather than guess a fourth
  fix blind, this page hands the detector to the one instrument that HAS
  registered the artifact: Ryan's own eyes on his own display.

  Each button toggles ONE variable live, in place, on the real rendered
  page (same-origin iframe, no reload needed between toggles). Click one,
  look at the rim near the crown, click it again to revert, try the next.
  Report back which one (if any) changes what you see.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chroma seam bisector (dev only)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0c; color: #f4f2ec; }
  .panel {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 18px; background: #141216; border-bottom: 1px solid #2a2730;
  }
  .panel h1 { font-size: 14px; margin: 0 18px 0 0; font-weight: 700; }
  button {
    font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid #3a3640; background: #201d24; color: #f4f2ec; cursor: pointer;
  }
  button[aria-pressed="true"] { background: #e2a73c; color: #1a1508; border-color: #e2a73c; }
  button:hover { border-color: #e2a73c; }
  .hint { font-size: 12px; color: #a39d8f; margin-left: auto; max-width: 420px; }
  iframe { display: block; width: 100%; height: calc(100vh - 60px); border: 0; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Chroma seam bisector</h1>
    <button id="btn-striations" aria-pressed="false">Striations off</button>
    <button id="btn-svgmask" aria-pressed="false">SVG mask off (old bare clip)</button>
    <button id="btn-overlap" aria-pressed="false">2px overlap off</button>
    <button id="btn-scroll" type="button">Scroll to arc</button>
    <span class="hint">Click one at a time, look at the rim near the crown. Tell us which (if any) changes the dark line.</span>
  </div>
  <iframe id="site" src="/"></iframe>
  <script>
    const ifr = document.getElementById('site');
    const state = { striations: false, svgmask: false, overlap: false };

    function doc() { return ifr.contentDocument; }

    function apply() {
      const d = doc();
      if (!d) return;
      let style = d.getElementById('bisect-style');
      if (!style) {
        style = d.createElement('style');
        style.id = 'bisect-style';
        d.head.appendChild(style);
      }
      const rules = [];
      if (state.striations) rules.push('.chroma__striations{display:none!important;}');
      if (state.svgmask) {
        // revert to the pre-SVG bare clip, no mask at all
        rules.push('.chroma__arc-layer--occluder{mask:none!important;-webkit-mask:none!important;}');
      }
      if (state.overlap) {
        // SVG mask stays, but shrink r back to exactly var(--radius) (no 2px overlap)
        rules.push('#chroma-occluder-circle{r:var(--radius)!important;}');
      }
      style.textContent = rules.join('\n');
    }

    function wire(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        state[key] = !state[key];
        btn.setAttribute('aria-pressed', String(state[key]));
        apply();
      });
    }
    wire('btn-striations', 'striations');
    wire('btn-svgmask', 'svgmask');
    wire('btn-overlap', 'overlap');

    document.getElementById('btn-scroll').addEventListener('click', () => {
      const d = doc();
      const el = d && d.querySelector('.chroma__arc-layer--hot');
      if (el) el.scrollIntoView({ block: 'center' });
    });

    ifr.addEventListener('load', () => {
      // re-apply current toggle state on every iframe (re)load
      apply();
      const d = doc();
      const el = d && d.querySelector('.chroma__arc-layer--hot');
      if (el) el.scrollIntoView({ block: 'center' });
    });
  </script>
</body>
</html>
