<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- WEB QUALITY AUDIT FIX (low priority #8): reuses the same "RC" wordmark
       concept as .sitenav__mark (SiteNav.jsx) -- same dark bg / off-white
       ink tokens as the rest of the site -- as a simple SVG favicon instead
       of shipping no favicon at all (previously a 404 on every load). -->
  <rect width="64" height="64" rx="14" fill="#0a0a0c" />
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, system-ui, sans-serif"
    font-weight="700"
    font-size="26"
    letter-spacing="0.5"
    fill="#f4f2ec"
  >RC</text>
</svg>
